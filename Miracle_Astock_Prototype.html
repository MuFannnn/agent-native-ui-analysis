function equityChart(){let vals=[100,100.7,100.1,102,102.8,102.1,103.3,104.5,104,106,105.8,106.4,108.1,108.9,107,109.1,111,110.6,113.5,114.1,112.8,114.9,115.2,114,116.4,118.2,117.7,119.5,121.3,120.5,121.9,124.1,123.2,125.5,126.8,125.7];let base=vals.map((v,i)=>100+i*.37+Math.sin(i*1.13)*1.2);const W=540,H=268,L=44,R=16,T=24,B=34;const x=i=>L+(W-L-R)*i/(vals.length-1),y=v=>T+(H-T-B)*(130-v)/35;const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="分组表现示例折线图"><defs><linearGradient id="equityFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".12"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>${[100,110,120,130].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)" font-size="9" font-family="monospace">${v}</text>`).join('')}<path d="${path(vals)} L${x(vals.length-1)},${H-B} L${L},${H-B}Z" fill="url(#equityFill)"/><path d="${path(base)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.3" fill="none"/><path d="${path(vals)}" stroke="var(--blue)" stroke-width="2" fill="none"/><circle cx="${x(35)}" cy="${y(vals[35])}" r="3" fill="var(--blue)"/>${[[0,'2026 / 08'],[12,'09'],[24,'10'],[35,'10 / 23']].map(([i,t])=>`<text x="${x(i)}" y="${H-12}" text-anchor="${i===0?'start':i===35?'end':'middle'}" fill="var(--muted)" font-size="9" font-family="monospace">${t}</text>`).join('')}</svg>`}
const CANDLE_CACHE={};
function candlesFor(symbol){if(CANDLE_CACHE[symbol])return CANDLE_CACHE[symbol];const idx=STOCKS.findIndex(s=>s.id===symbol),arr=[];let p=24+Math.max(idx,0)*.65;const start=new Date('2026-08-25T00:00:00Z');let date=new Date(start);for(let i=0;i<44;i++){while([0,6].includes(date.getUTCDay()))date.setUTCDate(date.getUTCDate()+1);const o=p+Math.sin(i*2.3+.4)*.38;const c=o+Math.sin(i*1.53+idx*.3)*.85+.23+(i>25&&i<33?.26:0);const h=Math.max(o,c)+.3+Math.abs(Math.sin(i))* .62;const l=Math.min(o,c)-.25-Math.abs(Math.cos(i))*.48;arr.push({date:date.toISOString().slice(0,10),o,c,h,l,v:350+Math.abs(Math.sin(i*1.7))*(i>27&&i<34?700:450)});p=c;date.setUTCDate(date.getUTCDate()+1)}const stock=STOCKS.find(s=>s.id===symbol)||STOCKS[0];const scale=stock.price/arr.at(-1).c;arr.forEach(b=>{b.o*=scale;b.c*=scale;b.h*=scale;b.l*=scale});return CANDLE_CACHE[symbol]=arr}
function candleChart(symbol='600001',large=false){const data=candlesFor(symbol),W=660,H=large?355:300,L=12,R=47,T=24,B=58,plotH=H-T-B,hi=Math.max(...data.map(d=>d.h))+1,lo=Math.min(...data.map(d=>d.l))-1;const x=i=>L+(W-L-R)*(i+.5)/data.length,y=v=>T+(hi-v)/(hi-lo)*plotH;const step=(W-L-R)/data.length;const ma=data.map((d,i)=>data.slice(Math.max(0,i-4),i+1).reduce((a,z)=>a+z.c,0)/Math.min(i+1,5));return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((STOCKS.find(s=>s.id===symbol)||STOCKS[0]).name)}日K示意图，数据为虚构" data-chart-symbol="${symbol}"><text x="${L+4}" y="14" fill="var(--gold)" font-size="9" font-family="monospace">MA5  ${ma.at(-1).toFixed(2)}</text><text x="98" y="14" fill="var(--muted)" font-size="9">日 K · 不复权 · 演示</text>${[0,1,2,3].map(i=>{const v=lo+(hi-lo)*i/3;return `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"/><text x="${W-R+8}" y="${y(v)+3}" fill="var(--muted)" font-size="9" font-family="monospace">${v.toFixed(2)}</text>`}).join('')}${data.map((d,i)=>{const c=d.c>=d.o?'var(--red)':'var(--green)';return `<g data-candle-index="${i}"><line x1="${x(i)}" x2="${x(i)}" y1="${y(d.h)}" y2="${y(d.l)}" stroke="${c}"/><rect x="${x(i)-step*.29}" y="${Math.min(y(d.o),y(d.c))}" width="${step*.58}" height="${Math.max(1,Math.abs(y(d.o)-y(d.c)))}" fill="${c}"/><rect x="${x(i)-step*.29}" y="${H-18-d.v/1100*32}" width="${step*.58}" height="${d.v/1100*32}" fill="${c}" opacity=".43"/></g>`}).join('')}<path d="${ma.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="1.1"/><line x1="${L}" y1="${H-B+12}" x2="${W-R}" y2="${H-B+12}" stroke="var(--line)"/>${[0,14,29,43].map(i=>`<text x="${x(i)}" y="${H-4}" fill="var(--muted)" font-size="8" font-family="monospace" text-anchor="middle">${data[i].date.slice(5).replace('-','/')}</text>`).join('')}</svg>`}

function renderWatchlist(){const s=state.watchlist;const g=s.groups.find(g=>g.id===s.group)||s.groups[0];const rows=marketRows('watchlist');return `<section class="market-scene"><div class="market-toolbar"><h2>我的自选</h2><span class="sep"></span>${dateControl('watchlist')}<span class="badge subtle">静态演示</span><div class="toolbar-right"><div class="search">${I('search','small')}<input id="watchlist-search" placeholder="查找当前成员" value="${esc(s.search)}" aria-label="查找自选成员"></div>${B('addStock','添加证券','plus','small')}${IB('toggleInspector','panel','展开 / 收起证券详情','data-scene="watchlist"')}</div></div><div class="market-work"><aside class="watchlist-side"><div class="section-label">关注范围 ${IB('newGroup','plus','新建分组')}</div>${s.groups.map(z=>`<button class="scope-btn ${s.group===z.id?'active':''}" data-action="watchGroup" data-group="${z.id}">${I(z.icon,'small')}<span>${esc(z.name)}</span><span class="count">${z.ids.length}</span></button>`).join('')}<div class="section-label">研究结果</div><button class="scope-btn" data-action="watchGroup" data-group="key">${I('table','small')}回踩条件 · 候选样本<span class="count">6</span></button><div class="spacer"></div><div class="tiny muted" style="padding:12px 8px;line-height:1.9">示例名单仅保存在本次原型中<br>不会修改真实自选或研究</div></aside><div class="market-table-area"><div class="mode-line"><strong style="font-size:12px">${esc(g.name)}</strong><span class="muted">${rows.length} 只</span><span class="spacer"></span>${s.selected.length?B('removeSelected','移出当前范围','close','small ghost'):''}${B('referenceSelected','引用到研究','link','small ghost','data-scene="watchlist"')}${IB('columns','sliders','列与显示设置','data-scene="watchlist"')}</div><div class="table-scroll">${renderStockTable(rows,'watchlist')}</div></div>${s.inspector?renderInspector(s.focus||rows[0]?.id||'600001','watchlist'):''}</div><div class="scene-status"><span class="dot"></span>本次原型 · ${esc(g.name)}<span class="spacer"></span>已选 ${s.selected.length} 只 <span class="sep"></span>单击查看 · 双击开图</div></section>`}
function renderInspector(id,scene){const z=STOCKS.find(s=>s.id===id)||STOCKS[0];return `<aside class="inspector"><div class="inspector-head"><div><div class="inspector-name">${z.name}</div><div class="stock-code" style="margin-top:5px">${z.id} · ${z.theme} · 虚构证券</div></div>${IB('toggleInspector','close','关闭检查区',`data-scene="${scene}"`)}</div><div class="quote-line"><span class="quote-price ${z.gain>=0?'positive':'negative'}">${z.price.toFixed(2)}</span><span class="quote-change ${z.gain>=0?'positive':'negative'}">${z.gain>=0?'+':''}${z.gain.toFixed(2)}%</span></div><div class="tabbar"><button class="active" data-action="chartModal" data-symbol="${id}">日 K</button><button data-action="chartModal" data-symbol="${id}" data-type="intraday">分时</button><span class="spacer"></span><span class="badge subtle">示例走势</span></div><div class="inspector-content"><div class="chart-shell" data-ref-kind="chart" data-ref-id="${id}" data-ref-name="${z.name} · 日K区间">${candleChart(id)}</div><div class="details-grid"><div>成交额<strong>${z.amount.toFixed(2)}亿</strong></div><div>换手率<strong>${z.turnover.toFixed(2)}%</strong></div><div>连板高度<strong>${z.height} 板</strong></div><div>封单额<strong>${z.seal.toFixed(2)}亿</strong></div></div><div class="reason-note" data-ref-kind="note" data-ref-id="note-${id}" data-ref-name="${z.name} · 关注备注"><h3>关注备注</h3><p>${z.reason}。观察成交变化与所属梯队的反馈，暂不把形态解释为交易结论。</p></div><div class="reason-note" style="padding-top:0"><h3>内容来源</h3><p>原型内置虚构样本，仅用于展示表格、图表和对象引用的关系。</p></div></div><div class="inspector-actions">${B('chartModal','展开图表','expand','small',`data-symbol="${id}"`)}${B('referenceStock','加入问题','link','small ghost',`data-symbol="${id}"`)}</div></aside>`}
function auctionRows(stage){const s=state.auction;let rows=STOCKS.map((z,i)=>{const gain=+(Math.sin(i*1.17+.2)*3+2.6+stage*.75+(z.height-1)*.35).toFixed(2);const matched=+( .08+(18-i)*.031*(1+stage*.6)+Math.abs(Math.sin(i*2+stage))*.18).toFixed(2);const unmatched=+((Math.cos(i*.9+stage*.4)*.43+.21)*(1+stage*.15)).toFixed(2);return {...z,theme:themeFor(z,s.taxonomy),gain,matched,unmatched}});if(s.mode==='own')rows=rows.filter(z=>state.watchlist.groups.find(g=>g.id==='key').ids.includes(z.id));if(s.search)rows=rows.filter(z=>`${z.name}${z.id}${z.theme}`.includes(s.search));const k=s.stageSort[stage];rows.sort((a,b)=>(a[k]-b[k])*(s.ascending[stage]?1:-1));return rows}
function renderAuction(){const s=state.auction;return `<section class="market-scene"><div class="market-toolbar"><h2>集合竞价</h2><span class="sep"></span>${dateControl('auction')}<span class="muted tiny toolbar-secondary">结构基准 ${s.date==='2026-10-23'?'2026-10-22':'随示例日期展示'}</span><span class="badge subtle">虚构样本</span><div class="toolbar-right"><div class="search">${I('search','small')}<input id="auction-search" placeholder="定位证券或题材" value="${esc(s.search)}" aria-label="搜索竞价样本"></div>${IB('columns','sliders','竞价显示设置','data-scene="auction"')}</div></div><div class="mode-line"><div class="tabbar">${[['theme','题材'],['height','高度'],['own','自选'],['all','全景']].map(([v,t])=>`<button class="${s.mode===v?'active':''}" data-action="auctionMode" data-mode="${v}">${t}</button>`).join('')}</div><span class="sep"></span>${taxonomyControl('auction')}<label><input type="checkbox" data-check="auction.hideST" ${s.hideST?'checked':''}>去 ST</label><label><input type="checkbox" data-check="auction.hide20" ${s.hide20?'checked':''}>去 20cm</label><span class="spacer"></span><button class="btn ghost small ${s.link?'active':''}" data-action="auctionLink"><i class="toggle-dot"></i>联动定位</button>${B('referenceSelected','引用到研究','link','small ghost','data-scene="auction"')}</div><div class="auction-stage-wrap">${[0,1,2].map(renderAuctionStage).join('')}</div><div class="scene-status"><span class="dot"></span>三阶段独立排序 · 示例金额与价格均为虚构<span class="spacer"></span>选择证券可定位，双击查看图表</div></section>`}
function renderAuctionStage(stage){const s=state.auction,rows=auctionRows(stage);const time=['09:15','09:20','09:25'][stage];const match=rows.reduce((n,r)=>n+r.matched,0).toFixed(2);const groups=s.mode==='theme'?[...new Set(rows.map(r=>r.theme))]:s.mode==='height'?[...new Set(rows.map(r=>r.height))].sort((a,b)=>b-a):[null];const head=(key,label)=>`<button data-action="auctionSort" data-stage="${stage}" data-key="${key}">${label}${s.stageSort[stage]===key?I(s.ascending[stage]?'up':'down','small'):I('sort','small')}</button>`;return `<section class="auction-stage"><div class="stage-heading"><div><div class="stage-n">PHASE 0${stage+1}</div><div class="stage-time">${time}</div><div class="stage-label">${['初始观察','意愿比较','结果对照'][stage]} <span>·</span><span>示例阶段</span></div></div><span class="badge ${stage===2?'blue':'subtle'}">${['第一阶段','第二阶段','第三阶段'][stage]}</span></div><div class="stage-kpi"><span>匹配额<strong>${match} 亿</strong></span><span>高开<strong>${rows.filter(x=>x.gain>0).length} / ${rows.length}</strong></span></div><div class="table-scroll"><table class="market-table"><thead><tr><th class="stock-col">证券 / 高度</th><th>${head('gain','竞涨幅')}</th><th>${head('matched','匹配额')}</th>${s.showUnmatched?`<th>${head('unmatched','未匹额')}</th>`:''}</tr></thead><tbody>${groups.map(g=>`${g!==null?`<tr class="group-row"><td colspan="4">${I('down','small').replace('<svg','<svg style="display:inline-block;vertical-align:middle;margin-right:4px"')}${s.mode==='height'?g+' 板梯队':g}<span class="group-count">${rows.filter(x=>(s.mode==='height'?x.height:x.theme)===g).length}</span></td></tr>`:''}${rows.filter(x=>g===null||(s.mode==='height'?x.height:x.theme)===g).map(z=>`<tr data-action="auctionFocus" data-stage="${stage}" data-symbol="${z.id}" class="${(s.link?s.focus:s.focused[stage])===z.id?'focused':''}" data-ref-kind="auction" data-ref-id="${z.id}@${time}" data-ref-name="${z.name} · ${time} 竞价" data-ref-date="${s.date}"><td class="stock-col"><div class="stock-cell"><span><span class="stock-name">${z.name}</span><div class="stock-code">${z.id}</div></span><span class="stock-height">${z.height===1?'首板':z.height+'板'}</span></div></td><td class="stage-num-cell ${z.gain>=0?'positive':'negative'}">${z.gain>=0?'+':''}${z.gain.toFixed(2)}%</td><td class="heat-value"><i class="heat-bg" style="--bar:${Math.min(90,z.matched*65)}%"></i><span>${z.matched>=1?z.matched.toFixed(2)+'亿':(z.matched*10000).toFixed(0)+'万'}</span></td>${s.showUnmatched?`<td class="${z.unmatched>=0?'positive':'negative'}">${z.unmatched>=0?'+':'−'}${Math.abs(z.unmatched*10000).toFixed(0)}万</td>`:''}</tr>`).join('')}`).join('')}</tbody></table>${!rows.length?'<div class="empty-results">无匹配样本</div>':''}</div><div class="stage-bottom"><span>${rows.length} 只证券 · 独立列与排序</span><span class="mono">${time}:00</span></div></section>`}
function productArt(p,index){const color=index%3===0?'var(--blue)':index%3===1?'var(--green)':'var(--gold)';return `<svg viewBox="0 0 340 90" width="100%" height="90" aria-hidden="true"><defs><pattern id="pg${index}" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="var(--line2)"/></pattern></defs><rect width="340" height="90" fill="url(#pg${index})"/>${index%3===0?`<path d="M140 65 161 53 181 58 202 36 225 40 245 21 268 26 287 10" fill="none" stroke="${color}" stroke-width="1.7"/><path d="M140 71 161 65 181 67 202 56 225 59 245 51 268 54 287 41" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`:index%3===1?[0,1,2,3,4,5,6].map((x)=>`<rect x="${143+x*22}" y="${64-(12+(x*7)%42)}" width="12" height="${12+(x*7)%42}" rx="2" fill="${color}" opacity="${.25+x*.09}"/>`).join(''):`<path d="M165 45h33m14 0h35m-49 0V24h35m-35 21v22h35" stroke="${color}" fill="none" stroke-width="1.2"/><rect x="145" y="34" width="25" height="23" rx="4" fill="var(--bg)" stroke="${color}"/><rect x="233" y="14" width="40" height="19" rx="4" fill="var(--bg)" stroke="var(--line2)"/><rect x="247" y="35" width="30" height="20" rx="4" fill="var(--bg)" stroke="${color}"/><rect x="233" y="60" width="40" height="17" rx="4" fill="var(--bg)" stroke="var(--line2)"/>`}</svg>`}
function renderMarketplace(){const s=state.marketplace;if(s.product)return renderProductDetail(s.product);const list=PRODUCTS.filter(p=>(s.category==='全部'||p.type===s.category)&&(!s.search||`${p.title}${p.author}${p.desc}`.includes(s.search)));return `<section class="catalog-scene"><div class="catalog-header"><div><div class="catalog-eyebrow">METHODS / KNOWLEDGE / CAPABILITIES</div><h1>发现方法，拓展你的研究能力。</h1><p>了解内容、依据与交付，再决定它是否适合你的研究。</p></div><div class="search">${I('search')}<input id="catalog-search" value="${esc(s.search)}" placeholder="搜索方法、能力或创作者" aria-label="搜索商城"></div></div><div class="catalog-content"><div class="catalog-controls"><div class="tabbar">${['全部','知识与方法','能力包','策略'].map(t=>`<button class="${s.category===t?'active':''}" data-action="catalogCategory" data-category="${t}">${t}</button>`).join('')}</div>${B('myPublications','我的发布','upload','ghost small')}</div><div class="product-grid">${list.map(p=>{const idx=PRODUCTS.indexOf(p);return `<button class="product-card" data-action="productDetail" data-product="${p.id}" data-ref-kind="product" data-ref-id="${p.id}" data-ref-name="${p.title} · 商品介绍"><div class="product-visual">${productArt(p,idx)}<span class="art-label">${p.label}</span><span class="art-icon">${I(p.icon)}</span></div><div class="product-copy"><span class="badge subtle">${p.tag}</span><h3>${p.title}</h3><p>${p.desc}</p><div class="author"><span class="avatar">${p.initial}</span>${p.author}<span class="spacer"></span>${I('chevron','small')}</div><div class="product-bottom"><span>内容示例 · 暂未开售</span><span>查看内容 ${I('arrow','small')}</span></div></div></button>`}).join('')}</div>${!list.length?'<div class="empty-results">没有匹配的示例商品</div>':''}<div class="catalog-note">${I('info','small')}商品、作者与交付均为原型示例，不提供购买或收益承诺。</div></div></section>`}
function renderProductDetail(id){const p=PRODUCTS.find(p=>p.id===id)||PRODUCTS[0];return `<section class="catalog-scene"><div style="max-width:1060px;margin:0 auto;padding:18px 24px 0">${B('catalogBack','返回商城','back','ghost small')}</div><div class="product-detail"><article class="detail-main" data-ref-kind="product" data-ref-id="${p.id}" data-ref-name="${p.title} · 公开介绍"><span class="badge blue">${p.type}</span><h1>${p.title}</h1><div class="author"><span class="avatar">${p.initial}</span>${p.author}<span class="muted">· 内容与作者均为示例</span></div><p>${p.desc}</p><h3>适合怎样的研究</h3><p>适合希望把个人经验拆成明确条件，再结合数据与反例进行讨论的用户。先理解方法的适用范围，再决定采用哪些部分。</p><h3>示例交付内容</h3>${p.files.map((f,i)=>`<div class="delivery-row">${I(i===1?'code':'file')}<span>${f}</span><span>内容示例</span></div>`).join('')}<h3>依据与使用边界</h3><p>这组内容用于检验商品、个人资源和研究入口的衔接。没有接入真实商品、评估或交易服务。商品的实际内容、版本、价格和权利应在正式接入后由业务提供。</p><div class="inline-note" style="font-size:12px;line-height:1.8">知识引用、能力启用和策略执行是不同动作。阅读商品介绍不会自动启用任何能力。</div></article><aside class="detail-aside"><h3>内容与使用</h3><span class="badge subtle">原型展示</span><p>本原型没有交易功能。你可以把这份公开介绍加入研究输入，看看不同场景如何连接同一个对象。</p>${B('referenceProduct','引用到研究','link','primary',`data-product="${p.id}"`)}<button class="btn" disabled>获取功能尚未接入</button><div class="details-grid" style="display:block;border:0;padding:19px 0 0"><div style="margin-bottom:9px">交付类型<strong style="font-family:inherit">${p.type}</strong></div><div>当前版本<strong>示例 1.0</strong></div></div></aside></div></section>`}

function marketActionRows(ids){
  if(!Array.isArray(ids)||ids.length>100)throw Error('EXPLICIT_ROW_IDS_REQUIRED');
  const keys=[...new Set(ids)];
  const rows=marketFilteredRows().filter(r=>keys.includes(r.id)||keys.includes(r.securityId)||keys.includes(marketRowKey(r)));

function performMarketAction(invocation){
  if(invocation.viewId!=='market.main')throw Error('WRONG_VIEW');
  const {action,params={},origin='user'}=invocation;
  if(origin==='agent'&&!invocation.expectedRevision)throw Error('EXPECTED_REVISION_REQUIRED');
  if(invocation.expectedRevision&&invocation.expectedRevision!==marketRevision())throw Error('STALE_SAMPLE');
  const p=marketPreferences();
  if(action==='sort'){
    const c=MARKET_COLUMNS.find(c=>c.id===params.columnId);
    if(!c?.sort)throw Error('COLUMN_NOT_SORTABLE');
    if(!['asc','desc',null].includes(params.direction))throw Error('INVALID_SORT_DIRECTION');
    p.sort=params.direction?{columnId:c.id,direction:params.direction}:null;
  }else if(action==='resize'){
    const c=MARKET_COLUMNS.find(c=>c.id===params.columnId);
    if(!c||!Number.isFinite(params.width)||params.width<c.minWidth||params.width>600)throw Error('INVALID_COLUMN_WIDTH');
    p.columns.find(x=>x.id===c.id).width=Math.round(params.width);
  }else if(action==='visibility'){
    const c=MARKET_COLUMNS.find(c=>c.id===params.columnId);
    if(!c||typeof params.visible!=='boolean'||(c.required&&!params.visible))throw Error('INVALID_COLUMN_VISIBILITY');
    p.columns.find(x=>x.id===c.id).hidden=!params.visible;
  }else if(action==='move'){
    const i=p.columns.findIndex(c=>c.id===params.columnId),j=i+params.delta;
    if(![-1,1].includes(params.delta)||i<0||j<0||j>=p.columns.length)throw Error('INVALID_COLUMN_MOVE');
    [p.columns[i],p.columns[j]]=[p.columns[j],p.columns[i]];
  }else if(action==='resetColumns'){
    state.market.columnPreferences[marketPreferenceKey()]=defaultMarketPreferences();state.market.preferenceProblem=false;
  }else if(action==='select'){
    if(!Array.isArray(params.securityIds))throw Error('INVALID_SELECTION');
    state.market.selected=marketActionRows(params.securityIds).map(r=>r.id);
  }else if(['reference','copy','openChart','addWatchlist'].includes(action)){
    const rows=marketActionRows(params.rowIds);if(!rows.length)throw Error('EMPTY_SELECTION');
    const ids=rows.map(r=>r.id);
    if(action==='reference'){
      const ref=marketReference(ids,params.columnIds);addReferences([ref]);
      return {status:'completed',viewId:'market.main',referenceId:ref.id,rowIds:rows.map(marketRowKey)};
    }
    if(action==='openChart'){
      if(rows.length!==1)throw Error('SINGLE_ROW_REQUIRED');
      if(!['daily','intraday'].includes(params.chartType||'daily'))throw Error('UNSUPPORTED_CHART');
      showChart(rows[0].id,params.chartType||'daily');return {status:'completed',viewId:'market.main',securityId:rows[0].securityId};
    }
    if(action==='addWatchlist'){
      const group=state.watchlist.groups.find(g=>g.id===params.groupId);if(!group)throw Error('UNKNOWN_WATCHLIST');
      let added=0;for(const id of ids)if(!group.ids.includes(id)){group.ids.push(id);added++;}
      toast(`已加入「${group.name}」：${added} 只，原型内名单已更新。`);
      return {status:'completed',fixture:true,groupId:group.id,added};
    }
    const clean=v=>String(v??'').replace(/[\t\r\n]+/g,' ');
    let text;
    if(params.format==='codes')text=rows.map(r=>r.id).join('\n');
    else if(params.format==='cell'){
      const c=MARKET_COLUMNS.find(c=>c.id===params.columnId);if(!c||rows.length!==1)throw Error('SINGLE_CELL_REQUIRED');
      text=String(c.raw(rows[0])??'');
    }else if(params.format==='rows'){
      const ids=params.columnIds||marketVisibleColumns().map(c=>c.id),cols=ids.map(id=>MARKET_COLUMNS.find(c=>c.id===id));
      if(!cols.length||cols.some(c=>!c))throw Error('UNKNOWN_COLUMN');
      text=[cols.map(c=>c.label+(c.unit&&c.unit!=='Asia/Shanghai'?`（${c.unit}）`:'' )).join('\t'),...rows.map(r=>cols.map(c=>clean(c.raw(r))).join('\t'))].join('\n');
    }else throw Error('INVALID_COPY_FORMAT');
    return writeTableClipboard(text).then(()=>({status:'completed',viewId:'market.main',copiedRows:rows.length}));
  }else throw Error('UNSUPPORTED_ACTION');
  if(origin==='user'&&['sort','resize','visibility','move','resetColumns'].includes(action))saveMarketPreferences();
  if(params.render!==false&&state.scene==='market')renderScene();
  return {status:'completed',viewId:'market.main',queryRevision:marketRevision(),state:marketDescription().view};
}
async function writeTableClipboard(text){
  if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);toast('已复制。');return;}catch{}}

  let copied=false;try{copied=document.execCommand('copy')}finally{input.remove()}
  if(!copied)throw Error('CLIPBOARD_UNAVAILABLE');toast('已复制。');
}

  const title=header?column.label+(column.sort?'':' · 不可排序'):rowIds.length>1?`操作所选 ${rowIds.length} 只证券`:row?`${row.name} · ${row.id}`:'表格操作';
  menu.innerHTML=`<div class="table-context-title">${esc(title)}</div>`+items.map((it,i)=>it?`<button type="button" role="menuitem" data-menu-index="${i}" ${it.disabled?'disabled':''}>${esc(it.label)}</button>`:'<div role="separator"></div>').join('');
  document.body.append(menu);
  const rect=menu.getBoundingClientRect();menu.style.left=Math.max(6,Math.min(x,innerWidth-rect.width-6))+'px';menu.style.top=Math.max(6,Math.min(y,innerHeight-rect.height-6))+'px';

  tableContextMenu={anchor:focusAnchor,items,revision};

function renderMarket(){const s=state.market,rows=marketFilteredRows();return `<section class="market-scene compact-market"><div class="market-toolbar"><div class="market-primary-controls">${compactDateControl('market')}<span class="sep"></span><div class="tabbar">${[['flat','平铺'],['concept','题材'],['height','高度']].map(([m,label])=>`<button class="${s.mode===m?'active':''}" data-action="marketMode" data-mode="${m}">${label}</button>`).join('')}</div>${taxonomyControl('market')}<label class="market-filter"><input type="checkbox" data-check="market.hideST" ${s.hideST?'checked':''}>去 ST</label><label class="market-filter"><input type="checkbox" data-check="market.hide20" ${s.hide20?'checked':''}>去 20cm</label></div><div class="toolbar-right"><div class="search">${I('search','small')}<input id="market-search" placeholder="证券、代码或题材" value="${esc(s.search)}" aria-label="搜索看盘样本"></div>${IB('marketRefresh','refresh','刷新')}${IB('marketColumns','sliders','列设置')}${IB('marketMenu','more','表格操作')}</div></div><div class="market-stat-strip"><span>当前样本 <b>${rows.length}</b> 只</span><i></i><span>最高连板 <b>${Math.max(0,...rows.map(r=>r.height))}</b> 板</span><i></i><span>题材 <b>${new Set(rows.map(r=>r.theme)).size}</b> 组</span><i></i><span>已选 <b>${s.selected.length}</b> 只</span><span class="spacer"></span>${B('addSelectedWatchlist','加入自选','plus','small ghost','data-scene="market"')}${B('marketReference','加入研究','link','small ghost')}</div><div class="market-work"><div class="market-table-area"><div class="table-scroll" id="market-scroll">${renderSemanticMarketTable()}</div></div>${s.inspector&&s.focus?renderInspector(s.focus,'market'):''}</div><div class="scene-status"><span>按证券身份定位</span><span class="spacer"></span>单击聚焦 · 双击开图 <span class="mono">${s.date}</span></div></section>`}

function marketRegionReference(start,box,point){if(state.scene!=='market')return null;const table=document.querySelector('.semantic-market-table');if(!table||!start.scope.contains(table))return null;const scroll=table.closest('.table-scroll').getBoundingClientRect();const intersects=b=>Math.min(b.right,box.right,scroll.right)>Math.max(b.left,box.left,scroll.left)&&Math.min(b.bottom,box.bottom,scroll.bottom)>Math.max(b.top,box.top,scroll.top);let rows=[],cols=[];if(point){const row=start.target.closest('tr[data-row-key]');if(!row||!table.contains(row))return null;rows=[row.dataset.symbol];const col=start.target.closest('[data-column-id]')?.dataset.columnId;cols=col?[col]:marketVisibleColumns().map(c=>c.id);}else{const rowEls=[...table.querySelectorAll('tr[data-row-key]')].filter(r=>intersects(r.getBoundingClientRect()));if(!rowEls.length)return null;rows=[...new Set(rowEls.map(r=>r.dataset.symbol))];cols=[...new Set(rowEls.flatMap(r=>[...r.querySelectorAll('td[data-column-id]')].filter(c=>intersects(c.getBoundingClientRect())).map(c=>c.dataset.columnId)))];if(!cols.length)cols=marketVisibleColumns().map(c=>c.id);}return marketReference(rows,cols)}
function bindMarketResizing(){document.querySelectorAll('[data-resize-column]').forEach(handle=>{handle.addEventListener('pointerdown',e=>{if(e.button!==0||e.ctrlKey&&e.shiftKey||state.selectionArmed)return;e.preventDefault();e.stopPropagation();const c=MARKET_COLUMNS.find(c=>c.id===handle.dataset.resizeColumn),start=e.clientX,before=marketPreferences().columns.find(x=>x.id===c.id).width;let current=before;handle.setPointerCapture(e.pointerId);const move=ev=>{current=Math.round(Math.max(c.minWidth,Math.min(600,before+ev.clientX-start)));const col=document.querySelector(`.semantic-market-table col[data-column-id="${c.id}"]`);if(col)col.style.width=current+'px';const table=document.querySelector('.semantic-market-table');if(table)table.style.width=marketVisibleColumns().reduce((n,col)=>n+(col.id===c.id?current:col.width),34)+'px';};const done=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',done);handle.removeEventListener('pointercancel',cancel);performMarketAction({viewId:'market.main',action:'resize',params:{columnId:c.id,width:current,render:false}});suppressClickUntil=Date.now()+160;};const cancel=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',done);handle.removeEventListener('pointercancel',cancel);if(state.scene==='market')renderScene()};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',done);handle.addEventListener('pointercancel',cancel)});handle.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const c=MARKET_COLUMNS.find(c=>c.id===handle.dataset.resizeColumn),w=marketPreferences().columns.find(x=>x.id===c.id).width;performMarketAction({viewId:'market.main',action:'resize',params:{columnId:c.id,width:Math.max(c.minWidth,Math.min(600,w+(e.key==='ArrowRight'?8:-8)))}});document.querySelector(`[data-resize-column="${c.id}"]`)?.focus()})})}

document.addEventListener('change',e=>{const el=e.target;if(el.dataset.taxonomyScene){const scene=el.dataset.taxonomyScene;if(!['market','auction'].includes(scene)||!MARKET_TAXONOMIES.some(t=>t.id===el.value))return;state[scene].taxonomy=el.value;if(scene==='market'){state.market.selected=[];state.market.focus=null;}else{state.auction.focus=null;state.auction.focused=[null,null,null];state.auction.lastStage=null;}renderScene();return;}if(el.dataset.marketVisible){try{performMarketAction({viewId:'market.main',action:'visibility',params:{columnId:el.dataset.marketVisible,visible:el.checked}})}catch{toast('此列不能隐藏。')}return;}if(el.dataset.marketWidth){try{performMarketAction({viewId:'market.main',action:'resize',params:{columnId:el.dataset.marketWidth,width:Number(el.value)}})}catch{toast('列宽超出允许范围。')}return;}});
